<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="810" viewBox="109.5 44.5 1620 810">
  <title>BlokiCrush</title>
  <defs>
    <linearGradient id="whiteBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#f4faff"/>
      <stop offset="1" stop-color="#c7e2ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9cf"/>
      <stop offset="0.34" stop-color="#ffe472"/>
      <stop offset="0.7" stop-color="#ffc21a"/>
      <stop offset="1" stop-color="#f08a00"/>
    </linearGradient>
    <linearGradient id="glassBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bdcff"/>
      <stop offset="0.5" stop-color="#3c8dfb"/>
      <stop offset="1" stop-color="#123ea8"/>
    </linearGradient>
    <linearGradient id="glassTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf8ff"/>
      <stop offset="0.45" stop-color="#6bbcff"/>
      <stop offset="1" stop-color="#2c66e2"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.33" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur8" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blur5" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Insignia de bloques -->
  <g>
    <rect x="800" y="80" width="190" height="190" rx="46" fill="#06123a" opacity="0.32" filter="url(#blur8)"/>
    <rect x="792" y="62" width="190" height="190" rx="44" fill="#ffffff" stroke="#0b2a6b" stroke-width="8"/>
    <rect x="806" y="76" width="162" height="162" rx="34" fill="url(#glassBlue)" stroke="#0b2a6b" stroke-width="4"/>
    <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="3">
      <rect x="822" y="92" width="62" height="62" rx="14" fill="url(#glassTile)"/>
      <rect x="894" y="92" width="62" height="62" rx="14" fill="url(#glassTile)"/>
      <rect x="822" y="164" width="62" height="62" rx="14" fill="url(#glassTile)"/>
      <rect x="894" y="164" width="62" height="62" rx="14" fill="url(#gold)"/>
    </g>
    <g fill="#ffffff">
      <rect x="831" y="99" width="44" height="15" rx="7.5" opacity="0.55"/>
      <rect x="903" y="99" width="44" height="15" rx="7.5" opacity="0.55"/>
      <rect x="831" y="171" width="44" height="15" rx="7.5" opacity="0.55"/>
      <rect x="903" y="171" width="44" height="15" rx="7.5" opacity="0.7"/>
    </g>
  </g>


  <!-- BLOKI -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" letter-spacing="12">
    <text x="887" y="516" text-anchor="middle" font-size="260" fill="#06123a" opacity="0.4" filter="url(#blur8)">BLOKI</text>
    <text x="887" y="508" text-anchor="middle" font-size="260" fill="#0a2463">BLOKI</text>
    <text x="887" y="490" text-anchor="middle" font-size="260" fill="url(#whiteBlue)"
          stroke="#0b2a6b" stroke-width="14" stroke-linejoin="round" paint-order="stroke fill">BLOKI</text>
    <text x="887" y="490" text-anchor="middle" font-size="260" fill="url(#gloss)" opacity="0.5">BLOKI</text>
  </g>

  <!-- CRUSH -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" letter-spacing="8">
    <text x="887" y="816" text-anchor="middle" font-size="320" fill="#3a0209" opacity="0.42" filter="url(#blur8)">CRUSH</text>
    <text x="887" y="808" text-anchor="middle" font-size="320" fill="#6b0718">CRUSH</text>
    <text x="887" y="790" text-anchor="middle" font-size="320" fill="url(#gold)"
          stroke="#7a0b1e" stroke-width="16" stroke-linejoin="round" paint-order="stroke fill">CRUSH</text>
    <text x="887" y="788" text-anchor="middle" font-size="320" fill="none"
          stroke="#fff6cf" stroke-width="3" stroke-opacity="0.45">CRUSH</text>
    <text x="887" y="790" text-anchor="middle" font-size="320" fill="url(#gloss)" opacity="0.7">CRUSH</text>
  </g>

  <!-- Chispas -->
  <g fill="#fff6c9">
    <g transform="translate(322 196)">
      <path d="M0 -52 L11 -13 L52 0 L11 13 L0 52 L-11 13 L-52 0 L-11 -13 Z" opacity="0.55" filter="url(#blur5)" fill="#ffd24a"/>
      <path d="M0 -34 L7 -8 L34 0 L7 8 L0 34 L-7 8 L-34 0 L-7 -8 Z"/>
    </g>
    <g transform="translate(1452 190)">
      <path d="M0 -42 L9 -10 L42 0 L9 10 L0 42 L-9 10 L-42 0 L-9 -10 Z" opacity="0.5" filter="url(#blur5)" fill="#ffd24a"/>
      <path d="M0 -27 L6 -6 L27 0 L6 6 L0 27 L-6 6 L-27 0 L-6 -6 Z" fill="#ffd24a"/>
    </g>
    <g transform="translate(250 700)">
      <path d="M0 -34 L7 -8 L34 0 L7 8 L0 34 L-7 8 L-34 0 L-7 -8 Z" fill="#ffd24a"/>
    </g>
    <g transform="translate(1584 754)">
      <path d="M0 -40 L9 -10 L40 0 L9 10 L0 40 L-9 10 L-40 0 L-9 -10 Z"/>
    </g>
  </g>
</svg>
